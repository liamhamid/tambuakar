# Tambuakar — refresh data langsung (Layer A) untuk papan pemuka IMPAX.
# Runner GitHub ada internet penuh: kutip Wikidata + GDELT + Google Trends -> Gold
# -> tulis docs/data.json (selamat-klien) -> commit balik supaya GitHub Pages
# (impax.tambuakar.com) rebuild dengan data betul. Tiada tindakan pemilik.

name: collect

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"   # ~10 pagi Malaysia

permissions:
  contents: write          # perlu untuk commit docs/data.json balik ke repo

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kutip Layer A -> Gold -> docs/data.json
        env:
          PYTHONPATH: src
        run: python -m tambuakar.publish
      - name: Simpan data langsung (artifact + Gold)
        uses: actions/upload-artifact@v4
        with:
          name: tambuakar-data
          path: data/
          if-no-files-found: warn
      - name: Commit data langsung (cetus rebuild Pages)
        run: |
          git config user.name  "tambuakar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/data.json)" ]; then
            git add docs/data.json
            git commit -m "data: refresh live Layer A ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "Tiada perubahan data.json — langkau commit."
          fi
